<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>
   Orefarer Wiki v1.01
  </title>
<style>
:root {
  color-scheme:dark;
  --bg:#0d1210;
  --panel:#19221f;
  --line:#354b40;
  --gold:#dfc58c;
  --muted:#aebbb1
}

* {
  box-sizing:border-box
}

body {
  margin:0;
  background:var(--bg);
  color:#f0f0e9;
  font:15px/1.55 system-ui,Segoe UI,sans-serif
}

header {
  background:#18221e;
  border-bottom:1px solid var(--line);
  padding:20px max(20px,calc((100vw - 1240px)/2))
}

h1 {
  margin:0;
  color:var(--gold);
  font-size:28px
}

header p {
  margin:4px 0;
  color:var(--muted)
}

.wrap {
  max-width:1240px;
  margin:auto;
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  gap:24px;
  padding:24px
}

nav {
  position:sticky;
  top:16px;
  align-self:start;
  display:grid;
  gap:4px
}

button {
  cursor:pointer
}

nav button {
  background:transparent;
  color:#d5dfd8;
  border:0;
  text-align:left;
  padding:10px;
  border-radius:7px
}

nav button.active,nav button:hover {
  background:#284235
}

main {
  min-width:0
}

.panel {
  border:1px solid var(--line);
  background:var(--panel);
  border-radius:12px;
  padding:20px;
  margin-bottom:18px
}

h2 {
  color:var(--gold);
  margin:0 0 14px
}

h3 {
  margin:16px 0 8px;
  color:#d5e3d8
}

p {
  margin:8px 0 12px
}

.muted {
  color:var(--muted)
}

.warning {
  color:#e7bb8a
}

.good {
  color:#9bd8ad
}

.scroll {
  overflow:auto
}

table {
  width:100%;
  border-collapse:collapse;
  font-size:13px
}

td,th {
  padding:9px;
  border-bottom:1px solid #34443c;
  text-align:left;
  vertical-align:top
}

th {
  color:var(--gold)
}

tr:hover {
  background:#26352c
}

input,select {
  background:#0e1712;
  color:#fff;
  border:1px solid #65756b;
  padding:9px;
  border-radius:6px;
  max-width:100%
}

input[type=number] {
  width:115px
}

#search {
  width:100%;
  margin-bottom:16px
}

.fields {
  display:flex;
  flex-wrap:wrap;
  gap:14px;
  align-items:end
}

.fields label,.field {
  display:grid;
  gap:5px;
  font-size:13px
}

.result {
  font-size:21px;
  color:var(--gold);
  font-weight:700;
  margin:12px 0 4px
}

.subresult {
  color:#d9e6d8
}

.pill {
  display:inline-block;
  background:#304538;
  border-radius:5px;
  padding:2px 7px;
  color:#c6e6cd;
  font-size:12px
}

.row {
  display:flex;
  gap:14px;
  flex-wrap:wrap
}

.row>* {
  flex:1;
  min-width:220px
}

.small {
  font-size:12px
}

.profile {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px
}

.profile label {
  display:grid;
  gap:4px
}

.profile input {
  width:100%
}

summary {
  cursor:pointer;
  color:var(--gold);
  font-weight:600;
  padding:6px 0
}

.recipe {
  border-top:1px solid #3b4d42;
  padding:8px 0
}

a {
  color:#d9c78d
}

button.action {
  border:1px solid #759078;
  background:#294436;
  color:white;
  padding:8px 12px;
  border-radius:6px
}

.note {
  border-left:3px solid #bca369;
  padding-left:12px;
  color:#d7c9aa
}

@media(max-width:780px) {
  .wrap {
  display:block;
  padding:14px
}

nav {
  position:static;
  display:flex;
  flex-wrap:wrap;
  margin-bottom:16px
}

nav button {
  padding:7px;
  font-size:12px
}


}

.info-tip {
  display:inline-block;
  position:relative;
  margin:5px 0;
  vertical-align:middle
}

.info-tip>summary {
  list-style:none;
  display:grid;
  place-items:center;
  width:21px;
  height:21px;
  border:1px solid #9fae9f;
  border-radius:50%;
  font-size:13px;
  font-weight:700;
  color:#e2d0a0;
  cursor:pointer;
  padding:0
}

.info-tip>summary::-webkit-details-marker {
  display:none
}

.info-tip>div {
  position:relative;
  max-width:680px;
  background:#25352d;
  border:1px solid #647969;
  border-radius:8px;
  padding:12px;
  margin:7px 0 8px;
  color:#e1e8df;
  font-size:13px;
  line-height:1.5
}

.info-tip[open] {
  display:block
}

.fields label select {
  max-width:320px
}

#laser {
  min-width:250px;
  max-width:340px
}

.expand-tools {
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin:0 0 12px
}

.expand-tools button {
  font-size:12px
}

.recipe-body {
  padding:8px 4px 15px
}

.recipe summary {
  font-size:15px;
  padding:12px 3px
}

.recipe summary:hover {
  color:#fff
}

.overview-bottom {
  margin-top:32px;
  padding-top:16px;
  border-top:1px solid var(--line)
}

.formula {
  padding:12px 15px;
  background:#25372c;
  border-radius:8px;
  font-weight:650;
  color:#d9e9d6
}

.warn-wrap {
  display:inline-flex;
  align-items:center;
  gap:7px;
  margin:6px 0
}

.warn-label {
  color:#ff7777;
  font-size:14px
}

.warn-tip>summary {
  border-color:#ed6060;
  color:#ff6b6b;
  background:#401f22
}

.warn-tip[open]>div {
  color:#e1e8df
}

.warn-tip[open]>div p {
  color:#e1e8df
}

.warn-tip[open] {
  display:inline-block
}

.warn-tip>div {
  min-width:250px
}

.recipe-body table {
  margin-bottom:10px
}

.refine-steps {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:12px;
  margin-top:20px
}

.refine-step {
  border:1px solid var(--line);
  padding:14px;
  border-radius:9px;
  background:#202e26
}

.refine-step p {
  font-size:13px;
  color:var(--muted)
}

sup {
  font-size:.65em;
  line-height:0;
  vertical-align:super
}

.skill-top {
  grid-template-columns:repeat(2,minmax(0,1fr));
  max-width:680px
}

.talent-grid {
  grid-template-columns:repeat(auto-fit,minmax(165px,1fr))
}

.reset-tools {
  display:flex;
  justify-content:flex-end;
  margin:12px 0
}

.reset-tools button {
  font-size:12px
}

@media(max-width:500px) {
  .skill-top {
  grid-template-columns:1fr
}


}

.add-cart {
  margin:12px 0 2px
}

.cart-qty {
  width:100px
}

.pill {
  margin-top:12px
}

#cartresults table td {
  word-break:normal
}

.cart-control {
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:14px 0 4px;
  max-width:100%
}

.cart-control .cart-quantity-label {
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px
}

.cart-control .catalog-qty {
  width:86px;
  max-width:86px;
  padding:7px
}

.cart-control .add-cart {
  margin:0
}

.cart-control .in-cart {
  border-color:#7bb39a;
  color:#b3ead0
}

.cart-status {
  font-size:12px;
  color:var(--muted)
}

.recipe:has(>.cart-control) {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:96px;
  flex-wrap:wrap
}

.recipe:has(>.cart-control)>.cart-control {
  margin-left:auto
}

.recipe-body>.cart-control {
  margin-top:18px
}

.quality-toggle {
  display:flex;
  align-items:center;
  gap:9px;
  margin:16px 0
}

.quality-toggle input {
  width:auto
}

#individualQualityFields[hidden] {
  display:none
}

.mining-resource-title {
  font-size:1.22rem;
  font-weight:750;
  margin:10px 0 15px;
  color:#e3eedd
}

@media(max-width:650px) {
  .recipe:has(>.cart-control) {
  gap:18px
}

.recipe:has(>.cart-control)>.cart-control {
  margin-left:0
}


}

.cart-increment {
  white-space:nowrap;
  touch-action:none;
  user-select:none
}

.cart-control {
  gap:10px
}

.cart-control .catalog-qty {
  width:75px
}

.cart-control {
  display:grid;
  grid-template-columns:95px 48px 48px 126px;
  grid-template-rows:auto 21px;
  column-gap:10px;
  row-gap:5px;
  align-items:center;
  width:max-content;
  max-width:100%;
  flex-shrink:0
}

.cart-control .cart-quantity-label {
  grid-column:1;
  grid-row:1
}

.cart-control .cart-increment:nth-of-type(1) {
  grid-column:2;
  grid-row:1
}

.cart-control .cart-increment:nth-of-type(2) {
  grid-column:3;
  grid-row:1
}

.cart-control .add-cart {
  grid-column:4;
  grid-row:1;
  min-width:126px
}

.cart-control .cart-status {
  grid-column:1 / -1;
  grid-row:2;
  min-height:19px;
  text-align:left;
  white-space:nowrap
}

.recipe:has(>.cart-control) {
  display:grid;
  grid-template-columns:minmax(130px,1fr) auto;
  align-items:center;
  gap:90px
}

.recipe:has(>.cart-control)>.cart-control {
  margin:0
}

.recipe-body>.cart-control {
  margin-top:20px
}

.drone-metrics {
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:12px;
  margin-top:14px
}

.drone-metrics>div {
  display:flex;
  flex-direction:column;
  gap:7px;
  padding:12px;
  background:#25372c;
  border-radius:8px
}

.drone-metrics span {
  color:#acb8ad;
  font-size:12px
}

.drone-metrics strong {
  font-size:16px
}

@media(max-width:750px) {
  .recipe:has(>.cart-control) {
  grid-template-columns:1fr;
  gap:12px
}

.cart-control {
  grid-template-columns:95px 48px 48px 126px
}


}

@media(max-width:420px) {
  .cart-control {
  grid-template-columns:85px 42px 42px 112px;
  column-gap:5px
}

.cart-control .add-cart {
  min-width:112px;
  font-size:11px
}

.cart-control .catalog-qty {
  width:70px
}


}


/* In-game talent category ordering. */
.talent-group { margin: 16px 0 24px; }
.talent-group h3 { margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }

<script>/* Orefarer Wiki v13 — core.js */

let D;

let active = 'Overview';

const sections = ['Overview', 'Resources & Refining', 'Printing', 'Mining Lasers', 'Engines', 'Other Fabrication', 'Ships', 'Stations & Projects', 'Skills & Talents', 'Calculators', 'Shopping Cart'];

const $ = id => document.getElementById(id);

const esc = x => String(x ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const n = x => Math.max(0, Number(x) || 0);

const f = (x, d = 2) => Number.isFinite(x) ? x.toLocaleString('en-US', { minimumFractionDigits: Math.min(2, d), maximumFractionDigits: 2 }) : '—';

const fmt = o => Object.entries(o || {}).map(([k, v]) => `${f(Number(v), 2)} ${k}`).join(', ');

const sortName = (a, b) => a.name.localeCompare(b.name);

const panel = (title, body) => `<section class="panel"><h2>${esc(title)}</h2>${body}</section>`;

const table = (h, rows) => `<div class="scroll"><table><thead><tr>${h.map(x => `<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(row => `<tr>${row.map(x => `<td>${esc(x ?? '—')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

const time = s => { if (!Number.isFinite(s))
    return '—'; let x = Math.round(s), h = Math.floor(x / 3600), m = Math.floor((x % 3600) / 60), sec = x % 60; return (h ? `${h}h ` : '') + (m ? `${m}m ` : '') + `${sec}s`; };

const rank = name => n(window.profile?.talents?.[name]);

const skill = name => n(window.profile?.skills?.[name]);

const industrial = () => Math.pow(.98, rank('Industrialist'));

const fee = base => base * industrial();

const duration = (base, talent) => base / (1 + rank(talent) * .02);

const read = id => n($(id)?.value);

const opts = (arr, value) => arr.map(x => `<option value="${esc(value(x))}">${esc(x.name)}</option>`).join('');

const filtered = items => items.filter(x => JSON.stringify(x).toLowerCase().includes($('search').value.toLowerCase()));

const warnInfo = (message) => `<span class="warn-wrap"><strong class="warn-label">Warning</strong><details class="info-tip warn-tip"><summary aria-label="Warning details" title="Warning details">i</summary><div>${message}</div></details></span>`;

const info = (message) => `<details class="info-tip"><summary aria-label="More information" title="More information">i</summary><div>${message}</div></details>`;

const note = info('Baseline values may be inferred from discounted screenshots. Speed bonuses are modeled as rate increases; exact rounding and modifier stacking are not verified.');

const STORE = 'orefarer-wiki-v3';

const ORE_ORDER = ['Iron', 'Copper', 'Silicon', 'Carbon', 'Titanium', 'Silver', 'Gold', 'Uranium'];

const oreOrder = x => { let i = ORE_ORDER.indexOf(x); return i < 0 ? 999 : i; };

const calcDefaults = { ore: '100', quality: '15', oreprice: '3.98', materialcost: '30', listing: '500', x1: '0', y1: '0', x2: '3', y2: '4', travelDistance: '5', dronen: '2', shipcargo: '120', droneDistance: '5', refineqty: '100', refineq: '15' };

let saved = { profile: null, calcs: {}, cart: {} };

try {
    saved = Object.assign(saved, JSON.parse(localStorage.getItem(STORE) || '{}'));
}
catch (e) { }

const save = () => { try {
    localStorage.setItem(STORE, JSON.stringify({ profile: window.profile, calcs: saved.calcs, cart: saved.cart }));
}
catch (e) { } };

const stored = (id, def) => esc(saved.calcs[id] ?? def);

const selected = (id, val) => saved.calcs[id] === val ? ' selected' : '';

const resetCalcs = () => { saved.calcs = {}; save(); render(); };

const resetAll = () => { saved.cart = {}; saved.calcs = {}; window.profile = JSON.parse(JSON.stringify(D.character_defaults)); save(); render(); };

const resetButton = (scope) => `<div class="reset-tools"><button class="action" data-reset="${scope}">Reset calculator</button></div>`;

const unit = x => String(x).replace(/m³/g, 'm<sup>3</sup>');

const cartKey = (kind, name) => kind + '|' + name;

const cartButton = (kind, name) => { const key = cartKey(kind, name), qty = saved.cart?.[key]?.qty ?? 0; const extra = kind === 'refined' || kind === 'printing' ? 5 : 0; return `<span class="cart-control" data-cart-control="${esc(key)}"><label class="cart-quantity-label">Quantity<input class="catalog-qty" aria-label="Quantity of ${esc(name)}" type="number" min="0" step="1" value="${qty || 1}" data-cart-kind="${esc(kind)}" data-cart-name="${esc(name)}"></label><button type="button" class="action cart-increment" data-amount="1" title="Click for +1; hold to add 10 per second">+1</button>${extra ? '<button type="button" class="action cart-increment" data-amount="5" title="Click for +5; hold to add 10 per second">+5</button>' : ''}<button class="action add-cart ${qty ? 'in-cart' : ''}" data-cart-kind="${esc(kind)}" data-cart-name="${esc(name)}">${qty ? 'Remove from cart' : 'Add to cart'}</button><span class="cart-status">${qty ? `In cart: ${f(qty, 2)}` : 'Not in cart'}</span></span>`; };

const expandControls = () => `<div class="expand-tools"><button class="action" data-expand="all">Expand all</button><button class="action" data-expand="none">Collapse all</button></div>`;

const itemDetails = (heading, body) => `<details class="recipe"><summary>${heading}</summary><div class="recipe-body">${body}</div></details>`;

    s += renderOtherFabricationPage();
    s += renderShipsPage();
    s += renderStationsProjectsPage();
    s += renderSkillsTalentsPage();
    s += renderCalculatorsPage();
    s += renderShoppingCartPage();
    $('content').innerHTML = unit(s || '<p>No matching entries.</p>');
    if (active === 'Skills & Talents')
        bindProfile();
    if (active === 'Calculators')
        bindCalcs();
    if (active === 'Resources & Refining')
        bindRefining();
    document.querySelectorAll('.cart-control').forEach(control => {
        let input = control.querySelector('.catalog-qty'), button = control.querySelector('.add-cart'), status = control.querySelector('.cart-status'), kind = button.dataset.cartKind, name = button.dataset.cartName, key = cartKey(kind, name);
        const normalize = x => Math.max(0, Math.floor(n(x)));
        const refresh = () => { let qty = saved.cart?.[key]?.qty || 0; button.textContent = qty ? 'Remove from cart' : 'Add to cart'; button.classList.toggle('in-cart', !!qty); status.textContent = qty ? 'In cart: ' + f(qty, 2) : 'Not in cart'; };
        const update = qty => {
            qty = normalize(qty);
            input.value = qty;
            if (qty)
                saved.cart[key] = { kind, name, qty };
            else
                delete saved.cart[key];
            save();
            refresh();
        };
        input.addEventListener('input', () => {
            if (input.value === '')
                return;
            update(input.value);
        });
        input.addEventListener('change', () => update(input.value));
        button.addEventListener('click', () => {
            if (saved.cart[key])
                update(0);
            else
                update(Math.max(1, normalize(input.value)));
        });
        control.querySelectorAll('.cart-increment').forEach(inc => {
            let delay = null, repeat = null, held = false, suppress = false;
            const stop = () => { clearTimeout(delay); clearInterval(repeat); delay = null; repeat = null; };
            const bump = amount => update(normalize(input.value) + amount);
            inc.addEventListener('pointerdown', e => {
                if (e.button !== 0)
                    return;
                stop();
                held = false;
                suppress = false;
                delay = setTimeout(() => { held = true; suppress = true; bump(1); repeat = setInterval(() => bump(1), 100); }, 350);
            });
            for (const event of ['pointerup', 'pointercancel', 'pointerleave'])
                inc.addEventListener(event, stop);
            inc.addEventListener('click', e => {
                if (suppress) {
                    e.preventDefault();
                    suppress = false;
                    return;
                }
                bump(Number(inc.dataset.amount));
            });
            inc.addEventListener('blur', stop);
        });
    });
    if (active === 'Shopping Cart')
        bindCart();
    document.querySelectorAll('[data-reset]').forEach(b => b.onclick = () => {
        if (b.dataset.reset === 'all')
            resetAll();
        else if (b.dataset.reset === 'refining') {
            delete saved.calcs.refineqty;
            delete saved.calcs.refineq;
            save();
            render();
        }
        else if (b.dataset.reset === 'ore') {
            ['ore', 'quality', 'oreprice'].forEach(k => delete saved.calcs[k]);
            save();
            render();
        }
        else if (b.dataset.reset === 'printing') {
            ['recipe', 'materialcost', 'listing'].forEach(k => delete saved.calcs[k]);
            save();
            render();
        }
        else if (b.dataset.reset === 'travel') {
            ['x1', 'y1', 'x2', 'y2', 'travelDistance', 'travelDistanceMode', 'travelengine', 'travelTier'].forEach(k => delete saved.calcs[k]);
            save();
            render();
        }
        else if (b.dataset.reset === 'drone') {
            ['laser', 'minedore', 'drone', 'dronen', 'shipcargo', 'droneDistance', 'droneTier'].forEach(k => delete saved.calcs[k]);
            save();
            render();
        }
    });
    document.querySelectorAll('[data-expand]').forEach(b => b.onclick = () => { let area = b.closest('.panel'); area.querySelectorAll('details.recipe').forEach(d => d.open = b.dataset.expand === 'all'); });
    document.querySelectorAll('[data-goto]').forEach(a => a.onclick = e => { e.preventDefault(); active = a.dataset.goto; $('search').value = ''; draw(); });
}

function bindRefining() {
    const update = () => {
        let a = read('refineqty'), b = Math.min(100, read('refineq'));
        $('refineout').innerHTML = unit(`${f(a * b / 100, 3)} m³ refined material · ${f(fee(a * b / 100), 3)}c refining fee`);
        for (let id of ['refineqty', 'refineq'])
            saved.calcs[id] = $(id).value;
        save();
    };
    ['refineqty', 'refineq'].forEach(id => $(id).addEventListener('input', update));
    update();
}

// Talent groups and order match the in-game Talent screen screenshots.
const TALENT_GROUPS = [
  ['Flight', ['Piloting', 'Drone Operator']],
  ['Mining', ['Iron Miner', 'Copper Miner', 'Silicon Miner', 'Carbon Miner', 'Titanium Miner', 'Silver Miner', 'Gold Miner', 'Uranium Miner']],
  ['Production', ['Refiner', 'Printer', 'Fabricator', 'Shipwright', 'Industrialist']],
  ['Cargo & Storage', ['Cargo Management', 'Drone Logistics', 'Heavy Hauler', 'Tetris Master']],
  ['Contracts', ['Contract Negotiator', 'Contract Specialist']]
];

function talentField(definition) {
  const [name, effect, per, unit, compounded] = definition;
  const suffix = unit === 'percent' ? '%' : unit === 'm3' ? ' m³' : ' slots';
  return `<label>${esc(name)}<span class="small muted">${esc(effect)}: ${per}${suffix}/rank${compounded ? ' (compounded)' : ''}</span><input type="number" min="0" step="1" data-talent="${esc(name)}" value="${rank(name)}"></label>`;
}

function talentGroupsUI() {
  const definitions = new Map(D.talent_definitions.map(def => [def[0], def]));
  return TALENT_GROUPS.map(([group, names]) => {
    const fields = names.map(name => definitions.get(name)).filter(Boolean).map(talentField).join('');
    return `<section class="talent-group"><h3>${esc(group)}</h3><div class="profile talent-grid">${fields}</div></section>`;
  }).join('');
}

function profileUI() {
  const skills = ['Captain', 'Drone Operator'].map(name => `<label>${esc(name)} level<input type="number" min="0" step="1" data-skill="${esc(name)}" value="${skill(name)}"></label>`).join('');

    <p>Skills determine unlocks; talent ranks change most bonuses. Every skill level-up grants one Talent Point. Rank 0 is the unmodified game baseline.</p>

  `) + note;
}

function bindProfile() { document.querySelectorAll('[data-skill]').forEach(el => el.oninput = () => { window.profile.skills[el.dataset.skill] = n(el.value); profileSummary(); save(); }); document.querySelectorAll('[data-talent]').forEach(el => el.oninput = () => { window.profile.talents[el.dataset.talent] = n(el.value); profileSummary(); save(); }); $('reset').onclick = () => { window.profile = JSON.parse(JSON.stringify(D.character_defaults)); save(); render(); }; profileSummary(); }

function profileSummary() { let drones = skill('Drone Operator') >= 20 ? 4 : skill('Drone Operator') >= 10 ? 3 : 2; let tier = skill('Captain') >= 20 ? 3 : skill('Captain') >= 10 ? 2 : 1; $('profileout').textContent = `Maximum ship tier T${tier}; drone control limit ${drones}; refining fee ${f(fee(1))}c/m³; printing speed +${rank('Printer') * 2}%; fabrication speed +${rank('Fabricator') * 2}%.`; }

<script>/* Orefarer Wiki v13 — calculators.js */

function laserOptions() { let ores = [...new Set(D.mining_lasers.map(x => x.ore))].sort((a, b) => oreOrder(a) - oreOrder(b)); return ores.map(ore => { let arr = D.mining_lasers.filter(x => x.ore === ore).sort((a, b) => a.tier - b.tier || ({ Standard: 0, Fuel: 1, Nuclear: 2 }[a.variant] - { Standard: 0, Fuel: 1, Nuclear: 2 }[b.variant])); return `<optgroup label="${esc(ore)}">${arr.map(x => `<option value="${esc(x.name)}"${selected('laser', x.name)}>T${x.tier} ${esc(x.variant)}${x.variant === 'Standard' ? '' : ' Powered'} Mining Laser</option>`).join('')}</optgroup>`; }).join(''); }

function calcUI() { let recipes = D.printing.slice().sort(sortName), drones = D.drone_specs.slice().sort(sortName); let field = (id, label, value) => `<label>${label}<input id="${id}" type="number" value="${stored(id, value)}" ${['x1', 'y1', 'x2', 'y2'].includes(id) ? '' : 'min="0"'}></label>`; let choose = (id, arr) => `<select id="${id}">${arr.map(x => `<option value="${esc(x.name)}"${selected(id, x.name)}>${esc(x.name)}</option>`).join('')}</select>`; return panel('Ore refining cost', `<div class="fields">${field('ore', 'Ore quantity m³', 100)}${field('quality', 'Quality %', 15)}${field('oreprice', 'Ore price c/m³', 3.98)}</div>${resetButton('ore')}<div id="oreout" class="result"></div>`) + panel('Printing and market', `<div class="fields"><label>Printed item${choose('recipe', recipes)}</label>${field('materialcost', 'Average refined material cost c/m³', 30)}${field('listing', 'Market listing price (c) for profit', 500)}</div>${resetButton('printing')}<div id="printout" class="result"></div>${info('Average material cost is an approximation; all refined inputs currently use the same price.')}`) + panel('Travel', `<div class="fields">${field('x1', 'Start X', 0)}${field('y1', 'Start Y', 0)}${field('x2', 'End X', 3)}${field('y2', 'End Y', 4)}${field('travelDistance', 'Distance (or enter coordinates)', 5)}<label>Ship tier<select id="travelTier"><option value="1"${selected('travelTier', '1')}>T1 (50 distance/click)</option><option value="2"${selected('travelTier', '2')}>T2 (75 distance/click)</option><option value="3"${selected('travelTier', '3')}>T3 (100 distance/click)</option></select></label><label>Engine / travel option<select id="travelengine"><option value="Wayfarer"${selected('travelengine', 'Wayfarer')}>Wayfarer (15s/distance)</option>${D.engines.slice().sort(sortName).map(x => `<option value="${esc(x.name)}"${selected('travelengine', x.name)}>${esc(x.name)}</option>`).join('')}</select></label></div>${resetButton('travel')}<div id="travelout" class="result"></div>${info('Piloting is modeled as a speed increase. Exact travel modifier stacking is not verified.')}`) + panel('Infinite mining / sustainable drone hauling', `<p>Maximum ship-to-station distance where drone hauling matches mining output.</p>${info('A steady-state model: drones fly round trips and refuel at the ship or station. Fuel availability, turnaround timing and cargo buffering may affect actual results. A full fuel tank per trip is not required.')}<div id="laserresource" class="mining-resource-title"></div><div class="fields"><label>Mining laser<select id="laser">${laserOptions()}</select></label><label>Resource being mined<select id="minedore"></select></label><label>Drone model${choose('drone', drones)}</label>${field('dronen', 'Active drones', 2)}${field('shipcargo', 'Ship cargo capacity m³', 120)}${field('droneDistance', 'Distance from station', 5)}<label>Ship tier<select id="droneTier"><option value="1"${selected('droneTier', '1')}>T1</option><option value="2"${selected('droneTier', '2')}>T2</option><option value="3"${selected('droneTier', '3')}>T3</option></select></label></div>${resetButton('drone')}<div id="droneout" class="result"></div><div id="dronedetails" class="subresult"></div>${info('Drone Operator talent changes drone speed, while its skill level changes the control limit. Drones refuel as needed at either endpoint. Veinseeker dual-laser power sharing is not included in this calculator. Active laser count is always one.')}`) + note; }

function syncMinedOre() { let laser = D.mining_lasers.find(x => x.name === $('laser')?.value); let ore = $('minedore'); if (!laser || !ore)
    return; let current = ore.value || saved.calcs.minedore; let allowed = [laser.ore, 'Ice']; ore.innerHTML = allowed.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join(''); ore.value = allowed.includes(current) ? current : laser.ore; saved.calcs.minedore = ore.value; let display = $('laserresource'); if (display)
    display.textContent = 'Resource being mined: ' + ore.value; }

function bindCalcs() {
    syncMinedOre();
    const coordIds = ['x1', 'y1', 'x2', 'y2'];
    const updateDistance = () => {
        const coords = coordIds.map(id => Number($(id).value));
        if (coords.some(v => !Number.isFinite(v)))
            return;
        const distance = Math.hypot(coords[2] - coords[0], coords[3] - coords[1]);
        $('travelDistance').value = String(Number(distance.toFixed(2)));
        saved.calcs.travelDistance = $('travelDistance').value;
        saved.calcs.travelDistanceMode = 'coordinates';
    };
    // Coordinates are authoritative unless the last deliberate edit was a manual distance.
    if (saved.calcs.travelDistanceMode !== 'manual')
        updateDistance();
    document.querySelectorAll('#content input,#content select').forEach(el => {
        const handle = () => {
            if (el.id === 'laser')
                syncMinedOre();
            saved.calcs[el.id] = el.value;
            if (coordIds.includes(el.id))
                updateDistance();
            else if (el.id === 'travelDistance')
                saved.calcs.travelDistanceMode = 'manual';
            save();
            calculate();
        };
        el.addEventListener('input', handle);
        if (coordIds.includes(el.id))
            el.addEventListener('change', handle);
    });
    calculate();
}

function calculate() {
    let ore = read('ore'), q = read('quality') / 100, out = ore * q;
    $('oreout').innerHTML = unit(`${f(out, 3)} m³ refined · ${f(ore * read('oreprice') + fee(out))}c total · ${f(fee(out))}c processing fee`);
    let rec = D.printing.find(x => x.name === $('recipe').value), material = Object.values(rec.inputs_m3).reduce((a, b) => a + b, 0) * read('materialcost'), prod = material + fee(rec.base_fee_c_estimate), listing = read('listing');
    $('printout').innerHTML = unit(`${f(prod)}c production · ${time(duration(rec.base_seconds_estimate, 'Printer'))} printing · ${f(listing * .98 - prod)}c profit after 2% market fee`);
    let dist = read('travelDistance'), eng = D.engines.find(x => x.name === $('travelengine').value), way = $('travelengine').value === 'Wayfarer', speed = way ? 15 : (eng?.seconds_per_distance ?? 30);
    let travelTier = Math.max(1, Math.min(3, read('travelTier') || 1)), travelMax = [0, 50, 75, 100][travelTier], clicks = dist > 0 ? Math.ceil((dist - 1e-9) / travelMax) : 0;
    let travelWarning = travelTier > (skill('Captain') >= 20 ? 3 : skill('Captain') >= 10 ? 2 : 1) ? warnInfo('Captain level is insufficient for the selected ship tier.') : '';
    $('travelout').innerHTML = unit(`${f(dist, 3)} distance · ${time(dist * speed / (1 + rank('Piloting') * .025))} travel · <b>${clicks} travel click${clicks === 1 ? '' : 's'}</b> (max ${travelMax} distance/click)${!way && eng?.cartridge_pct_per_distance ? ` · ${f(dist * eng.cartridge_pct_per_distance)}% of a Fuel Cartridge` : ' · no engine fuel required'} ${travelWarning}`);
    let laser = D.mining_lasers.find(x => x.name === $('laser').value), drone = D.drone_specs.find(x => x.name === $('drone').value), oreName = $('minedore').value, minerBonus = rank(oreName + ' Miner') * .02, rate = laser.mining_rate_m3_s * (1 + minerBonus);
    let num = Math.max(1, read('dronen')), cap = drone.cargo_m3 + rank('Drone Logistics'), spd = drone.seconds_per_distance / (1 + rank('Drone Operator') * .025), limit = skill('Drone Operator') >= 20 ? 4 : skill('Drone Operator') >= 10 ? 3 : 2;
    let theoretical = Math.max(0, (num * cap / rate) / (2 * spd));
    let practical = theoretical;
    let droneTier = Math.max(1, Math.min(3, read('droneTier') || 1));
    let actualDistance = read('droneDistance');
    let roundTripSeconds = 2 * actualDistance * spd;
    let throughput = roundTripSeconds > 0 ? num * cap / roundTripSeconds : Infinity;
    let netRate = Math.max(0, rate - throughput);
    let fillSeconds = netRate > 1e-10 ? read('shipcargo') / netRate : Infinity;
    let fuelPerTrip = 2 * actualDistance * drone.fuel_m3_per_distance;
    let fuelPerSecond = roundTripSeconds > 0 ? num * fuelPerTrip / roundTripSeconds : 0;
    let fuelUntilFull = Number.isFinite(fillSeconds) ? fuelPerSecond * fillSeconds : Infinity;
    let fuelPerHour = fuelPerSecond * 3600;
    $('droneout').innerHTML = unit(`Maximum theoretical sustainable distance: ${f(theoretical, 3)} distance units`);
    let notes = [];
    if (droneTier > (skill('Captain') >= 20 ? 3 : skill('Captain') >= 10 ? 2 : 1))
        notes.push(`Captain skill is insufficient to pilot a T${droneTier} ship.`);
    if (num > limit)
        notes.push(`Warning: Drone Operator skill level ${skill('Drone Operator')} permits only ${limit} drones.`);
    if (read('shipcargo') < cap)
        notes.push('Warning: Ship cargo capacity is smaller than one drone load.');
    if (laser.variant !== 'Standard')
        notes.push('Fueled mining lasers require cartridges and stop mining when cartridges run out; uninterrupted operation also requires ongoing cartridge supply.');
    if (laser.tier > (skill('Captain') >= 20 ? 3 : skill('Captain') >= 10 ? 2 : 1))
        notes.push('Warning: selected laser tier exceeds your Captain ship-tier unlock.');
    if (drone.tier > (skill('Captain') >= 20 ? 3 : skill('Captain') >= 10 ? 2 : 1))
        notes.push('Warning: selected drone tier exceeds your Captain ship-tier unlock.');
    $('dronedetails').innerHTML = unit(`<p>Mining rate: <b>${f(rate, 3)} m³/s</b> · Per-drone load: <b>${f(cap, 3)} m³</b> · Adjusted one-way drone time: <b>${f(spd, 3)} s/distance</b>.</p><div class="drone-metrics"><div><span>Entered distance</span><strong>${f(actualDistance, 3)}</strong></div><div><span>Drone hauling rate</span><strong>${Number.isFinite(throughput) ? f(throughput, 3) + ' m³/s' : 'Instantaneous (distance 0)'}</strong></div><div><span>Time until ship fills</span><strong>${Number.isFinite(fillSeconds) ? time(fillSeconds) : 'Sustainable / no fill'}</strong></div><div><span>Fuel per round trip, per drone</span><strong>${f(fuelPerTrip, 3)} m³</strong></div><div><span>${Number.isFinite(fillSeconds) ? 'Estimated drone fuel until full' : 'Estimated drone fuel per hour'}</span><strong>${f(Number.isFinite(fillSeconds) ? fuelUntilFull : fuelPerHour, 3)} m³</strong></div></div>${info('Estimates assume an initially empty ship, continuous mining, full-load drone trips, continuous average hauling, sufficient refueling supplies and no turnaround delays. Actual cargo fills in steps, so the true time may differ. Fuel use includes both outbound and return travel. Drones can refuel at either endpoint.')}${notes.length ? warnInfo(notes.map(x => `<p>${esc(x)}</p>`).join('')) : ''}`);
}
</script>
<script>/* Orefarer Wiki v13 — cart.js */

function cartUI() { let entries = Object.entries(saved.cart || {}); let rows = entries.map(([key, x]) => `<tr><td>${esc(x.name)}</td><td>${esc(x.kind)}</td><td><input class="cart-qty" type="number" min="0" step="any" data-key="${esc(key)}" value="${f(x.qty, 0)}"></td><td><button class="action cart-remove" data-key="${esc(key)}">Remove</button></td></tr>`).join(''); return panel('Shopping Cart / Crafting Planner', `<p>Build a shopping list from refined materials, printed parts, fabricated equipment, and ships. Quantities of refined products are m³; all others are item counts.</p><div class="scroll"><table><thead><tr><th>Product</th><th>Type</th><th>Quantity</th><th></th></tr></thead><tbody>${rows || '<tr><td colspan="4">Your cart is empty. Add items from the catalog pages.</td></tr>'}</tbody></table></div><label class="quality-toggle"><input type="checkbox" id="individualQuality" ${saved.calcs.individualQuality === 'true' ? 'checked' : ''}> Set separate ore quality percentages</label><div class="fields"><label>Universal ore quality (%)<input type="number" id="cartquality" min="0.001" max="100" step="any" value="${stored('cartquality', '15')}" ${saved.calcs.individualQuality === 'true' ? 'disabled' : ''}></label><label>Ice purity (%)<input type="number" id="cartice" min="0.001" max="100" step="any" value="${stored('cartice', '85')}"></label></div><div id="individualQualityFields" class="fields" ${saved.calcs.individualQuality === 'true' ? '' : 'hidden'}>${ORE_ORDER.map(ore => `<label>${ore} quality (%)<input type="number" class="individual-quality" data-ore="${ore}" id="cartq_${ore}" min="0.001" max="100" step="any" value="${stored('cartq_' + ore, '15')}"></label>`).join('')}</div><div class="reset-tools"><button class="action" id="cartreset">Reset cart</button></div><div id="cartresults"></div>${info('Raw-ore estimates assume uniform ore quality for each resource. Refining, printing, fabrication and ship construction work durations are summed as work time, not wall-clock completion time; queues and parallel lanes can change elapsed time. Refining times are not yet recorded. Mining laser fabrication times are reconstructed from the supplied screenshots and tier scaling; some are estimates. Some mining laser quantities are extrapolated. Ship construction times are fixed base values, reduced when a job starts with Shipwright talents. These estimates do not include mining or hauling time.')}`); }

function cartBreakdown() {
    let totals = {}, raw = {}, refined = {}, stages = { refining: 0, printing: 0, fabrication: 0, shipbuilding: 0 }, costs = { refining: 0, printing: 0, fabrication: 0 }, missing = [], estimates = [];
    let quality = Math.max(.00001, Math.min(100, read('cartquality'))) / 100, oreQuality = name => saved.calcs.individualQuality === 'true' ? Math.max(.00001, Math.min(100, read('cartq_' + name))) / 100 : quality, iceQuality = Math.max(.00001, Math.min(100, read('cartice'))) / 100;
    const add = (obj, k, v) => { obj[k] = (obj[k] || 0) + v; };
    const refine = (name, qty, depth = 0) => { if (qty <= 0)
        return; if (depth > 12) {
        missing.push('Circular recipe: ' + name);
        return;
    } add(refined, name, qty); if (name === 'Fuel') {
        costs.refining += fee(qty);
        refine('Water', qty * 5, depth + 1);
        return;
    } if (name === 'Steel' || name === 'Titanium Steel') {
        let recipe = name === 'Steel' ? D.refining.steel : D.refining.titanium_steel;
        costs.refining += fee(qty);
        for (let [k, v] of Object.entries(recipe)) {
            if (k !== 'output_m3')
                refine(k, qty * v / recipe.output_m3, depth + 1);
        }
        return;
    } if (name === 'Water') {
        add(raw, 'Ice', qty / iceQuality);
        costs.refining += fee(qty);
        return;
    } if (D.resources.includes(name) && name !== 'Ice') {
        add(raw, name, qty / oreQuality(name));
        costs.refining += fee(qty);
        return;
    } missing.push('Unknown refined material: ' + name); };
    const printed = (name, qty) => { let r = D.printing.find(x => x.name === name); if (!r) {
        missing.push('Missing printing recipe: ' + name);
        return;
    } stages.printing += qty * duration(r.base_seconds_estimate, 'Printer'); costs.printing += qty * fee(r.base_fee_c_estimate); for (let [k, v] of Object.entries(r.inputs_m3))
        refine(k, qty * v); };
    const fabricated = (name, qty) => { let r = D.fabrication_recipes.find(x => x.name === name); if (!r) {
        missing.push('Missing fabrication recipe: ' + name);
        return;
    } stages.fabrication += qty * duration(r.base_seconds, 'Fabricator'); costs.fabrication += qty * fee(r.base_fee_c); for (let [k, v] of Object.entries(r.inputs_items))
        printed(k, qty * v); };
    const laser = (name, qty) => { let r = D.mining_lasers.find(x => x.name === name); if (!r) {
        missing.push('Unknown laser: ' + name);
        return;
    } if (r.quantity_status !== 'verified')
        estimates.push(name + ' component quantities are extrapolated'); if (!Number.isFinite(r.components_each)) {
        missing.push('Missing component quantity: ' + name);
        return;
    } let each = r.components_each * qty; for (let comp of [r.frame, 'Wiring Bundle', r.board, 'Heat Sink', r.ore + ' Laser Head'])
        printed(comp, each); if (r.variant !== 'Standard')
        printed('Pressure Vessel', each); costs.fabrication += qty * fee(r.base_fee_c_estimate); stages.fabrication += qty * duration(r.base_seconds_estimate, 'Fabricator'); };
    for (let x of Object.values(saved.cart || {})) {
        let qty = n(x.qty);
        if (!qty)
            continue;
        if (x.kind === 'refined')
            refine(x.name, qty);
        else if (x.kind === 'printed')
            printed(x.name, qty);
        else if (x.kind === 'laser')
            laser(x.name, qty);
        else if (x.kind === 'fabricated')
            fabricated(x.name, qty);
        else if (x.kind === 'ship') {
            let ship = D.ships.find(s => s.name === x.name);
            if (!ship) {
                missing.push('Unknown ship: ' + x.name);
                continue;
            }
            for (let [k, v] of Object.entries(ship.construction_materials_m3))
                refine(k, qty * v);
            stages.shipbuilding += qty * ship.construction_hours * 3600 / (1 + rank('Shipwright') * .02);
        }
    }
    let materialRows = Object.entries(raw).sort((a, b) => oreOrder(a[0]) - oreOrder(b[0])).map(([k, v]) => [k, `${f(v, 2)} m³`]);
    let refinedRows = Object.entries(refined).sort((a, b) => oreOrder(a[0]) - oreOrder(b[0]) || a[0].localeCompare(b[0])).map(([k, v]) => [k, `${f(v, 2)} m³`]);
    let stageRows = Object.entries(stages).map(([k, v]) => [k, k === 'refining' ? 'Not recorded' : time(v)]);
    let costRows = Object.entries(costs).map(([k, v]) => [k, `${f(v, 3)}c`]);
    $('cartresults').innerHTML = `<h3>Raw resources required</h3>${table(['Raw ore', 'Required volume'], materialRows)}<h3>Refined materials required</h3><p class="small muted">Includes intermediate refined materials such as Water, Steel, and Titanium Steel. Quantities are production requirements, not additional raw-ore costs.</p>${table(['Refined material', 'Required volume'], refinedRows)}<h3>Processing and construction work</h3>${table(['Stage', 'Summed processing time'], stageRows)}<h3>Processing fees (talent-adjusted)</h3>${table(['Stage', 'Coins'], costRows)}<p class="result">Total processing fees: ${f(Object.values(costs).reduce((a, b) => a + b, 0), 3)}c</p>${estimates.length ? warnInfo(estimates.map(x => `<p>${esc(x)}</p>`).join('')) : ''}${missing.length ? warnInfo(missing.map(x => `<p>${esc(x)}</p>`).join('')) : ''}`;
}

function bindCart() { document.querySelectorAll('.cart-qty').forEach(el => el.oninput = () => { let x = saved.cart[el.dataset.key]; if (!x)
    return; x.qty = n(el.value); if (!x.qty)
    delete saved.cart[el.dataset.key]; save(); cartBreakdown(); }); document.querySelectorAll('.cart-remove').forEach(el => el.onclick = () => { delete saved.cart[el.dataset.key]; save(); render(); }); $('individualQuality').onchange = () => { saved.calcs.individualQuality = String($('individualQuality').checked); $('cartquality').disabled = $('individualQuality').checked; $('individualQualityFields').hidden = !$('individualQuality').checked; save(); cartBreakdown(); }; for (let id of ['cartquality', 'cartice', ...ORE_ORDER.map(x => 'cartq_' + x)])
    $(id).oninput = () => { saved.calcs[id] = $(id).value; save(); cartBreakdown(); }; $('cartreset').onclick = () => { saved.cart = {}; save(); render(); }; cartBreakdown(); }
</script>
<script>/* Orefarer Wiki v13 — bootstrap.js */

function draw() { document.querySelectorAll('nav button').forEach(x => x.classList.toggle('active', x.dataset.page === active)); render(); }

function init(d) { D = d; window.profile = saved.profile && typeof saved.profile === 'object' ? saved.profile : JSON.parse(JSON.stringify(D.character_defaults)); $('nav').innerHTML = sections.map(x => `<button data-page="${esc(x)}">${esc(x)}</button>`).join(''); $('nav').onclick = e => { let p = e.target.dataset.page; if (p) {
    active = p;
    $('search').value = '';
    draw();
} }; $('search').oninput = render; draw(); }

if (window.OREFARER_DATA)
    init(window.OREFARER_DATA);
else
    fetch('data.json').then(r => { if (!r.ok)
        throw Error('data unavailable'); return r.json(); }).then(init).catch(e => { $('content').innerHTML = `<section class="panel"><h2>Could not load database</h2><p>Start a local web server or use the standalone HTML version.</p></section>`; });
</script>
